# Generate the Xcode project with XcodeGen: `brew install xcodegen && xcodegen generate`.
name: Kira

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # iPhone only for now: no iPad layout, and not offered on Mac or Apple Vision Pro.
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"

packages:
  KiraCore:
    path: Packages/KiraCore

targets:
  Kira:
    type: application
    platform: iOS
    sources:
      - path: Kira
        excludes:
          - Info.plist
          - Kira.entitlements
    dependencies:
      - package: KiraCore
      - target: KiraWidgets
    info:
      path: Kira/Info.plist
      properties:
        CFBundleDisplayName: Kira
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-Italic.ttf
          - Figtree.ttf
          - Figtree-Italic.ttf
        NSMicrophoneUsageDescription: Kira listens when you tap the mic, so you can log spending by saying it.
        NSSpeechRecognitionUsageDescription: Kira turns what you say into entries. When your iPhone supports it, this happens on the device.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.kira
            CFBundleURLSchemes:
              - kira
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Kira/Kira.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.kira
    settings:
      base:
        PRODUCT_NAME: Kira
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kira
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  KiraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KiraWidgets
        excludes:
          - Info.plist
          - KiraWidgets.entitlements
      - path: Kira/Shared
      - path: Kira/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: KiraCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: KiraWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kira
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-Italic.ttf
          - Figtree.ttf
          - Figtree-Italic.ttf
    entitlements:
      path: KiraWidgets/KiraWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.kira
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kira.widgets
        SKIP_INSTALL: YES

schemes:
  Kira:
    build:
      targets:
        Kira: all
    run:
      config: Debug
      commandLineArguments:
        "-KiraSampleData YES": false
    archive:
      config: Release
